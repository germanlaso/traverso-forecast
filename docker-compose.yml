services:
  # ── PostgreSQL MRP ────────────────────────────────────────────────────────────
  mrp_db:
    image: postgres:16-alpine
    container_name: traverso_mrp_db
    environment:
      POSTGRES_DB: mrp
      POSTGRES_USER: mrp_user
      POSTGRES_PASSWORD: ${MRP_DB_PASSWORD:-mrp_traverso_2026}
    volumes:
      - mrp_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"           # 5433 para no colisionar con precios_postgres (5432)
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrp_user -d mrp"]
      interval: 10s
      timeout: 5s
      retries: 5
  # ── Motor de forecast (Prophet + API FastAPI) ─────────────────────────────────
  forecast:
    build: ./forecast
    container_name: traverso_forecast
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./forecast:/app
      - forecast_models:/app/models
    environment:
      - TZ=America/Santiago
      - SQL_SERVER=${SQL_SERVER}
      - SQL_DATABASE=${SQL_DATABASE}
      - SQL_USERNAME=${SQL_USERNAME}
      - SQL_PASSWORD=${SQL_PASSWORD}
      - SQL_DRIVER=ODBC Driver 18 for SQL Server
      - MRP_DB_URL=postgresql://mrp_user:${MRP_DB_PASSWORD:-mrp_traverso_2026}@mrp_db:5432/mrp
      - HANA_PWD=${HANA_PWD}
      - SMTP_PWD=${SMTP_PWD}
      - FALTANTES_DEST=${FALTANTES_DEST}
      - FALTANTES_ALERTA=${FALTANTES_ALERTA}
      - FALTANTES_DEST_AM=${FALTANTES_DEST_AM}
      - FALTANTES_DEST_FINAL=${FALTANTES_DEST_FINAL}
      - VIGIA_DEST=${VIGIA_DEST}
      - VIGIA_ALERTA=${VIGIA_ALERTA}
      - INFORME_VENTAS_DEST=${INFORME_VENTAS_DEST}
      - INFORME_VENTAS_ALERTA=${INFORME_VENTAS_ALERTA}
      - OV_NETTING_ENABLED=${OV_NETTING_ENABLED:-1}
    depends_on:
      mrp_db:
        condition: service_healthy
    restart: unless-stopped
  # ── Dashboard React (BUILD DE PRODUCCION para la intranet) ────────────────────
  # Sirve el build estatico con `serve` (ver dashboard/Dockerfile.prod).
  # - PUBLIC_URL=/planificacion         -> assets se piden bajo /planificacion/
  # - REACT_APP_API_BASE=/planificacion/api -> las llamadas van a /planificacion/api/*
  # El proxy de la intranet (4433) strippea /planificacion (UI->3000) y
  # /planificacion/api (API->8000).
  # NOTA: este servicio ya NO monta ./dashboard/src como volumen -> se pierde el
  # hot-reload en el server (comportamiento de produccion). Para iterar frontend
  # rapido, usar `npm start` local o un docker-compose.override.yml de dev.
  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.prod
      args:
        PUBLIC_URL: /planificacion
        REACT_APP_API_BASE: /planificacion/api
    container_name: traverso_dashboard
    ports:
      - "3000:3000"
    depends_on:
      - forecast
    restart: unless-stopped
volumes:
  forecast_models:
  mrp_db_data:
